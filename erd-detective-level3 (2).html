/* node types: E strong entity, W weak entity (double rectangle), C composite entity (diamond inside a rectangle),
   A attribute (k: 0 normal, 1 key = solid underline, 2 partial key = dashed underline), R relationship (c = 1:1, 1:M, M:N),
   S subclass circle (c = d, o or U) */
function shp(n){const{t,x,y}=n,s=esc(n.n||''),L=s.length;
 if(t=='E'){const w=Math.max(104,L*9+26);return`<rect x="${x-w/2}" y="${y-22}" width="${w}" height="44" fill="#e0f6fd" stroke="${C.E}" stroke-width="2.5"/><text x="${x}" y="${y+5}" text-anchor="middle" font-weight="700" fill="#04506a">${s}</text>`}
 if(t=='W'){const w=Math.max(104,L*9+26);return`<rect x="${x-w/2-6}" y="${y-28}" width="${w+12}" height="56" fill="#e0f6fd" stroke="${C.E}" stroke-width="2.5"/><rect x="${x-w/2}" y="${y-22}" width="${w}" height="44" fill="#e0f6fd" stroke="${C.E}" stroke-width="2"/><text x="${x}" y="${y+5}" text-anchor="middle" font-weight="700" fill="#04506a">${s}</text>`}
 if(t=='C'){const w=Math.max(170,L*10+72);return`<rect x="${x-w/2}" y="${y-34}" width="${w}" height="68" fill="#e0f6fd" stroke="${C.E}" stroke-width="2.5"/><polygon points="${x},${y-28} ${x+w/2-8},${y} ${x},${y+28} ${x-w/2+8},${y}" fill="#ffe1f4" stroke="${C.R}" stroke-width="2"/><text x="${x}" y="${y+5}" text-anchor="middle" font-weight="700" fill="#7c0c58">${s}</text>`}
 if(t=='S')return`<circle cx="${x}" cy="${y}" r="17" fill="#fff" stroke="#3d2d9c" stroke-width="2.5"/><text x="${x}" y="${y+5.5}" text-anchor="middle" font-size="16" font-weight="800" fill="#3d2d9c">${esc(n.c||'')}</text>`;
 if(t=='A'){const k=n.k|0,rx=Math.max(46,L*4.6+16),fill=k==1?'#fff4cf':k==2?'#f1ecff':'#e2f8ec',st=k==1?C.K:k==2?PC:C.A;
  return`<ellipse cx="${x}" cy="${y}" rx="${rx}" ry="22" fill="${fill}" stroke="${st}" stroke-width="2.5"/><text x="${x}" y="${y+5}" text-anchor="middle" fill="#0b4a2c"${k==1?' text-decoration="underline" font-weight="700"':k==2?' font-weight="700"':''}>${s}</text>${k==2?`<line x1="${x-L*3.7}" y1="${y+9.5}" x2="${x+L*3.7}" y2="${y+9.5}" stroke="#0b4a2c" stroke-width="1.5" stroke-dasharray="3.5 2.5"/>`:''}`}
 const w=Math.max(64,L*7.2+16);return`<polygon points="${x},${y-34} ${x+w},${y} ${x},${y+34} ${x-w},${y}" fill="#ffe1f4" stroke="${C.R}" stroke-width="2.5"/><text x="${x}" y="${y+5}" text-anchor="middle" font-weight="700" fill="#7c0c58">${s}</text>`}
const lbl=(x,y,t)=>`<text x="${x}" y="${y}" text-anchor="middle" font-weight="800" fill="#1a1640" stroke="#fff" stroke-width="4" paint-order="stroke">${t}</text>`;
function draw(N,Ed,sel){const g=i=>N.find(n=>n.id==i),isE=n=>n.t=='E'||n.t=='W';let s='',top='';
 Ed.forEach((e,i)=>{const a=g(e[0]),b=g(e[1]);if(!a||!b)return;
  s+=`<line data-e="${i}" x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}" stroke="#6b66a8" stroke-width="2"/><line data-e="${i}" x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}" stroke="transparent" stroke-width="22" pointer-events="stroke"/>`;
  const r=a.t=='R'?a:b.t=='R'?b:0;
  if(r&&r.c){const o=r==a?b:a,L=Ed.filter(q=>q.includes(r.id)).map(q=>q[0]==r.id?q[1]:q[0]),lb=r.c.split(':')[L.indexOf(o.id)];
   if(lb)s+=lbl(o.x+(r.x-o.x)*.4,o.y+(r.y-o.y)*.4-9,lb)}
  const c=a.t=='C'&&isE(b)?a:b.t=='C'&&isE(a)?b:0;
  if(c){const o=c==a?b:a;s+=lbl(o.x+(c.x-o.x)*.28,o.y+(c.y-o.y)*.28-9,'1')+lbl(c.x+(o.x-c.x)*.28,c.y+(o.y-c.y)*.28-9,'M')}
  const sc=a.t=='S'?a:b.t=='S'?b:0;
  if(sc){const o=sc==a?b:a;if(o.y>sc.y+12){const d=Math.hypot(o.x-sc.x,o.y-sc.y)||1,ux=(o.x-sc.x)/d,uy=(o.y-sc.y)/d,px=sc.x+ux*46,py=sc.y+uy*46,nx=-uy,ny=ux;
    top+=`<path d="M${px+nx*8} ${py+ny*8} Q${px+ux*13} ${py+uy*13} ${px-nx*8} ${py-ny*8}" fill="none" stroke="#3d2d9c" stroke-width="2.2"/>`}}});
 s+=top;
 N.forEach(n=>{const hw=n.t=='C'?105:75;s+=`<g data-id="${n.id}" style="cursor:grab">${n.id==sel?`<rect x="${n.x-hw}" y="${n.y-40}" width="${hw*2}" height="80" fill="none" stroke="#7a45ff" stroke-dasharray="5"/>`:''}${shp(n)}</g>`});return s}

P.A=(st=0,note='')=>{
 const DL=['The enhanced model adds three new ideas to the basic ERD. Let’s meet them.','A weak entity cannot be identified by its own attributes alone. It needs help from a strong entity.','A many-to-many relationship that carries its own data becomes a composite entity.','Time for a short video. Watch it right to the end and the next step unlocks.','When entities share attributes, pull the common ones up into a superclass.','Disjoint, overlap or union? Ask whether one record can sit in more than one subclass.','Learn to spot the clue words. They tell you which construct the scenario needs.','Great. Now put it into practice, starting with Spot the Construct.'];
 const T=[
 ['The Enhanced ER model (EERM)','The enhanced entity-relationship model adds more meaning to the basic ERM.',
  `<p>You already know entities, attributes, keys, relationships and cardinality. The <b>enhanced</b> model adds three new constructs for situations the basic ERD cannot describe well:</p>${gal([
  ['Weak entity','Depends on another entity. Double rectangle, partial key.',mini([{id:1,t:'W',x:140,y:45,n:'DEPENDENT'}],280)],
  ['Composite entity','A many-to-many relationship turned into an entity.',mini([{id:1,t:'C',x:140,y:45,n:'TREATMENT'}],280)],
  ['Superclass and subclass','A general entity and its specialised categories, linked by a circle.',mini([{id:1,t:'S',x:140,y:45,n:'',c:'d'}],280)]])}<p class=mu>Plus three constraints on the circle: <b>d</b> (disjoint), <b>o</b> (overlap) and <b>U</b> (union).</p>`],
 ['Weak entity','Depends on the presence of another entity.',
  `<ul class=bl><li>A <b>strong entity</b> exists independently, for example DOCTOR, DEPARTMENT or PRODUCT.</li><li>A <b>weak entity</b> depends on another entity. It has <b>no primary key</b>, only a <b>partial key</b>.</li><li>It is identified only by combining its <b>partial key</b> with the <b>foreign key</b> of the strong entity.</li><li>Symbol: <b>double rectangle</b>. The partial key is underlined with a <b>dashed</b> line.</li></ul>${D_WEAK()}
   <p><b>From ERD to tables.</b> The weak entity table gets the strong entity’s key as a foreign key (FK). FK + partial key together form the composite primary key.</p>
   ${rt('WORKER','strong entity',[['worker_no','PK'],['worker_name','']],[['W001','Ahmad'],['W002','Siti']])}
   ${rt('DEPENDENT','weak entity',[['worker_no','FK'],['dependent_no','partial key'],['dependent_name','']],[['W001','1','Aisyah'],['W001','2','Hafiz'],['W002','1','Daniel']],(i,j)=>j==1&&(i==0||i==2))}
   <p class=mu>The red cells show why a partial key is not enough: dependent_no = 1 appears for both W001 and W002. Identity = <b>worker_no + dependent_no</b>. If a WORKER is deleted, their DEPENDENT rows disappear too.</p>`],
 ['Composite entity','Simplify a many-to-many relationship.',
  `<p>A many-to-many (M:N) relationship is allowed in the ER model, but it is <b>not directly supported</b> in the relational model. It can be simplified by turning the relationship into an entity: the <b>composite entity</b>.</p><p><b>Before</b>: DOCTOR and PATIENT linked by treats (M:N).</p>${D_BEFORE()}<p><b>After</b>: the relationship becomes the composite entity TREATMENT.</p>${D_AFTER()}
  <ul class=bl><li>Symbol: a <b>diamond inside a rectangle</b>.</li><li>The M:N relationship becomes <b>two 1:M relationships</b>. <b>M</b> is placed at the composite entity, <b>1</b> at the original entities.</li><li>Each DOCTOR provides many TREATMENT, and each TREATMENT is provided by one DOCTOR. Each PATIENT receives many TREATMENT, and each TREATMENT is received by one PATIENT.</li><li>The composite entity has the <b>primary keys of both parents</b> as attributes. Together they form its <b>composite primary key</b> (both underlined).</li></ul>
  ${rt('TREATMENT','composite entity',[['staff_no','PK, FK'],['patient_no','PK, FK'],['treatment_type',''],['treatment_date','']],[['S101','P201','Check-up','2025-03-02'],['S101','P202','Vaccination','2025-03-02'],['S102','P201','X-ray','2025-03-09']])}`],
['Video lesson: Superclass and subclass','Watch the whole video to unlock the next step.',
  `<p class=mu>About 7 minutes. It explains what the EERM is, then superclass and subclass, generalisation and specialisation, and the d, o and U constraints with examples. Headphones help.</p>
   <div class=vw><video id=lvv preload=metadata playsinline disablepictureinpicture disableremoteplayback controlsList="nodownload noplaybackrate noremoteplayback" src="${VIDSRC}"></video>
   <div class=vc><button class=b id=lvp type=button>▶ Play</button><div class=vbar id=lvb role=progressbar aria-label="Video progress" tabindex=0><i id=lvm></i><i id=lvf></i></div><span class=mu id=lvt>0:00 / 0:00</span></div>
   <p class=vmsg id=lvs>You cannot skip ahead the first time. You can rewind and replay any part.</p></div>`],
 ['Superclass and subclass','Share common attributes, keep specific ones apart.',
  `<p>STUDENT has two categories, DIPLOMA and DEGREE. STUDENT is the <b>superclass</b>, DIPLOMA and DEGREE are the <b>subclasses</b>.</p>${D_STUD()}
   <p>Look at these three entities. They share the same first four attributes:</p><ul class=bl><li><b>Contract worker:</b> worker_no, worker_name, address, date_begin, <i>hour_rate</i></li><li><b>Permanent worker:</b> worker_no, worker_name, address, date_begin, <i>basic_salary, allowance</i></li><li><b>Engaged consultant:</b> worker_no, worker_name, address, date_begin, <i>contract_no, pay_rate</i></li></ul>${D_WORKER()}
   <ul class=bl><li>A <b>small circle</b> links the superclass and its subclasses. The ⊂ mark on the lines shows that a subclass is a <b>subset</b> of the superclass.</li><li><b>Common attributes</b> (and the key) are placed at the <b>superclass</b>. Subclasses keep only their <b>specific</b> attributes.</li></ul>
   <div class=gal><div class=card><b>Generalisation</b><p class=mu>Minimise differences. Several entities (CAR, LORRY) share attributes, so identify the common attributes and pull them up into a new superclass (VEHICLE).</p></div><div class=card><b>Specialisation</b><p class=mu>The opposite. Maximise differences. One entity (FURNITURE) has members with distinguishing attributes, so split it into subclasses (MADE, PURCHASED).</p></div></div>`],
 ['Constraints: d, o and U','Can one record belong to more than one subclass?',
  `<div class=gal><div class=card><b>Disjoint rule (d)</b><p class=mu>No overlap. A superclass record can appear in <b>only one</b> subclass. A VEHICLE is either a CAR or a LORRY, but not both.</p></div><div class=card><b>Overlap rule (o)</b><p class=mu>Subclasses may overlap. A record can appear in <b>more than one</b> subclass. A FURNITURE item can be both made and purchased parts.</p></div></div>
   <p><b>Disjoint (d)</b></p>${D_VEH('d')}<p><b>Overlap (o)</b></p>${D_FURN('o')}
   <p><b>Union (U)</b>: a subclass can have <b>more than one superclass</b>. An ASSET_OWNER can be an INDIVIDUAL or an ORGANIZATION.</p>${D_UNION()}`],
 ['Spot the clue words','Which construct does the scenario need?',
  `<div style="overflow-x:auto"><table class=rt style="text-align:left"><tr><th>Clue in the scenario<th>Construct</tr>
   <tr><td>“numbers restart / repeat for each…”, “cannot exist without…”<td><b>Weak entity</b>: double rectangle, partial key (dashed), FK from the strong entity</tr>
   <tr><td>Many-to-many <b>and</b> it has its own data (date, grade, quantity)<td><b>Composite entity</b>: diamond in rectangle, two 1:M, composite PK</tr>
   <tr><td>“Some X are A and some are B”, with shared attributes<td><b>Superclass and subclass</b>: circle, common attributes at the top</tr>
   <tr><td>“…either A or B, not both”<td>Circle with <b>d</b> (disjoint)</tr>
   <tr><td>“…can be both A and B”<td>Circle with <b>o</b> (overlap)</tr>
   <tr><td>One entity can come from more than one superclass<td>Circle with <b>U</b> (union)</tr></table></div>
   <p class=mu>Remember the cardinality rule from Level 3 still applies: only <b>1:1</b>, <b>1:M</b> and <b>M:N</b>, and the “one” side is written first.</p>`],
 ['You are ready','Now practise the new constructs.',`<p>Next you will <b>spot the construct</b> in short scenarios, <b>identify the keys</b>, decide <b>superclass attributes and constraints</b>, then <b>draw three EERDs</b>.</p><p class=mu>Tip: in the drawing tool, use <b>＋ Weak entity</b>, <b>＋ Composite entity</b> and <b>＋ Subclass circle</b>.</p>`]][st];
 $('#main').innerHTML=`<h2>Learn EER <span class=lv>Enhanced ER model</span></h2><div>${T&&[0,1,2,3,4,5,6,7].map(i=>`<span class="chip ${i==st?'on':''}">${i+1}</span>`).join('')}</div>${note?`<div class=card style="border-color:#e0a100"><b>🔒 ${note}</b></div>`:''}${say2(st==7?'joy':st==2||st==5?'think':'happy',DL[st],84)}<div class=card><h3>${T[0]}</h3><p><b>${T[1]}</b></p>${T[2]}</div>
 ${st?'<button class=b2 id=pv>← Back</button>':''}${st<7?`<button class=b id=nx${st==3&&!S.vid?' disabled':''}>Next →</button>`:'<button class=b id=ok>Finish ✓</button>'}`;
 if(st)$('#pv').onclick=()=>P.A(st-1);if(st<7)$('#nx').onclick=()=>P.A(st+1);else $('#ok').onclick=()=>{fin('A');go('home')};
 if(st==3)lvSetup()};
/* Generic one-question-at-a-time runner */
let streak=0;
function seq(k,title,items,qf){let i=0,sc=0;const m=$('#main');
 const step=()=>{if(i>=items.length){fin(k);const p=sc/items.length;m.innerHTML=`<div class=card><div class=resulthead>${dex(p>=.7?'joy':'think',84)}<div><h2>${title}: complete</h2><p class=big>${Math.round(sc*10)/10} / ${items.length} ${pips(p)}</p><p>${p>=.8?'Strong result. You have this part covered.':'Good progress. Retry to improve your score.'}</p></div></div><button class=b onclick="go('${k}')">Try again</button><button class=b2 onclick="go('home')">Dashboard</button></div>`;return}
  m.innerHTML=`<h2>${title}</h2><div class=bar><i style="width:${i/items.length*100}%"></i></div><p class=mu>Scenario ${i+1}/${items.length} · Score ${Math.round(sc*10)/10}</p><div class=card id=q></div><div id=fb></div>`;
  qf(items[i],$('#q'),(ok,tot,html)=>{sc+=ok/tot;S.ok+=ok;S.tot+=tot;save();const full=ok==tot;streak=full?streak+1:0;
   $('#fb').innerHTML=`<div class="card fb ${full?'good':'bad'}"><div class=verdict>${dex(full?'joy':ok?'think':'oops',46,1)}<b>${full?'Correct':ok?'Partly correct':'Not quite'}</b>${streak>1?`<span class=streak>${streak} correct in a row</span>`:''}</div><p>${html}</p></div><button class=b id=nx>${i+1<items.length?'Next':'See score'}</button>`;$('#nx').onclick=()=>{i++;step()};$('#nx').focus()})};step()}

/* Module B: spot the construct */
const OPT=['Weak entity','Composite entity','Superclass and subclass','Ordinary relationship only'];
const QS=[
{s:'A company records its workers and their dependants. Each dependant is numbered 1, 2, 3 … for each worker, so “dependant 1” exists for many different workers. If a worker leaves the company, the dependants are also removed from the system.',a:0,w:'dependant_no repeats for every worker, and a dependant cannot exist without its worker. DEPENDENT is a weak entity with a partial key.'},
{s:'A clinic records doctors and patients. A doctor treats many patients, and a patient is treated by many doctors. For every treatment the clinic must keep the treatment type and the treatment date.',a:1,w:'A many-to-many relationship that has its own attributes is simplified into a composite entity (TREATMENT).'},
{s:'A dealer sells cars and lorries. Both have a vehicle number, vehicle name, make and price. Cars also record the number of passengers, and lorries record the load capacity.',a:2,w:'CAR and LORRY share attributes. Generalise them into the superclass VEHICLE and keep passenger and capacity in the subclasses.'},
{s:'A bookstore keeps publishers and books. One publisher publishes many books, and each book has one publisher. Every book has its own ISBN and every publisher has its own publisher code.',a:3,w:'Both entities have their own key and exist independently. A normal 1:M relationship is enough.'},
{s:'A student can register for many courses, and a course has many students. The faculty keeps the semester and the grade of each registration.',a:1,w:'M:N with its own attributes (semester, grade): create the composite entity REGISTRATION.'},
{s:'A university has residential colleges, and every college has many rooms. Room 101 exists in every college, and a room cannot exist without its college.',a:0,w:'room_no repeats in each college and ROOM depends on COLLEGE: weak entity.'},
{s:'A store sells furniture. Some furniture is made in the workshop (carpenter name). Other furniture is purchased from suppliers (supplier code and unit price). Every item has a furniture code and details.',a:2,w:'The common attributes go to FURNITURE, and MADE and PURCHASED become subclasses (specialisation).'},
{s:'Each employee manages one store, and each store is managed by one employee. Both have their own ID.',a:3,w:'A simple 1:1 relationship. Nothing from the enhanced model is needed.'}];

const KQ=[
{ent:'DEPENDENT',txt:'DEPENDENT is a weak entity of WORKER. Its attributes are worker_no (from WORKER), dependent_no (1, 2, 3 … for each worker) and dependent_name.',attrs:['worker_no','dependent_no','dependent_name'],p:'dependent_no',fk:'worker_no',kind:'weak'},

{ent:'TREATMENT',txt:'TREATMENT is a composite entity between DOCTOR and PATIENT. Its attributes are staff_no, patient_no, treatment_type and treatment_date.',attrs:['staff_no','patient_no','treatment_type','treatment_date'],pk:['staff_no','patient_no'],par:['DOCTOR','PATIENT'],kind:'comp'},

{ent:'PERMANENT',txt:'PERMANENT is a subclass of the superclass WORKER. WORKER has worker_no (the key), worker_name, address and date_begin. PERMANENT adds basic_salary and allowance.',attrs:['basic_salary','allowance'],kind:'sub'}];
P.C=()=>seq('C','Identify the Key',KQ,(x,box,rep)=>{
 let qs;

P.G=()=>{$('#main').innerHTML=`<h2>Lecturer Guide <span class=lv>Level 3</span></h2>
<div class=card><h3>What Level 3 is based on</h3><p>Level 3 follows the lecture slides <i>Topic 4 (Part 3): Entity-Relationship Model</i>, the <b>Enhanced ER model</b>: <b>weak entity</b> (double rectangle, partial key with a dashed underline, identified by partial key + foreign key), <b>composite entity</b> (a many-to-many relationship turned into an entity, drawn as a diamond inside a rectangle, with two 1:M relationships and a composite primary key), and <b>superclass / subclass</b> entities (generalisation, specialisation, and the constraints <b>d</b> disjoint, <b>o</b> overlap and <b>U</b> union). Level 3 content (entities, attributes, keys, relationships, 1:1 / 1:M / M:N) is assumed.</p></div>
<div class=card><h3>Teaching video (compulsory)</h3><p>Module A, step 4 plays <b>Superclass_Subclass_EERM_EN_web.mp4</b>. Upload this file to the <b>same folder</b> as the HTML file (for GitHub Pages: the same folder as <i>erd-detective-level3.html</i>), with exactly this name. Until a student has watched the video to the end, forward seeking is blocked, speed is fixed at 1x, the video pauses if the tab is hidden, and Modules B to F are locked. Rewinding and replaying are always allowed. The completion is stored in the student’s browser, so it is a classroom aid and not tamper-proof. If the video does not load, students see a message naming the missing file.</p></div>
<div class=card><h3>Suggested session (about 90 minutes)</h3><p>1) <b>Learn EER</b> (15 min): go through the eight steps with the class. Step 4 is a compulsory 7-minute video (superclass and subclass): students cannot skip ahead the first time, and Modules B to F stay locked until they have watched it to the end. 2) <b>Spot the Construct</b> (10 min). 3) <b>Identify the Key</b> (10 min). 4) <b>Superclass & Constraints</b> (15 min). 5) <b>Draw 3 EERDs</b> (30 min): students may export each diagram as PNG. 6) <b>Challenge Quiz</b> (10 min) as a formative assessment.</p></div>
<div class=card><h3>Notation used in the drawing tool</h3><p><b>Strong entity</b>: single rectangle. <b>Weak entity</b>: double rectangle. <b>Composite entity</b>: diamond inside a rectangle; the app writes 1 next to each original entity and M next to the composite entity automatically. <b>Attributes</b>: oval; <i>Key</i> = solid underline, <i>Partial key</i> = dashed underline. <b>Subclass circle</b>: small circle with <b>d</b>, <b>o</b> or <b>U</b>. The superclass must be drawn above the circle and the subclasses below it; the ⊂ marks on the subclass lines are drawn automatically. Cardinality follows the Level 3 convention: only <b>1:1</b>, <b>1:M</b> (the “one” side first) and <b>M:N</b>.</p></div>
<div class=card><h3>Marking logic</h3><p>B: 1 mark per scenario (choose the construct). C: 1 mark per question (2 per item). D: 1 mark for each correct superclass attribute (each wrong tick removes 1, never below 0) plus 1 for the constraint; the union item has 2 marks (constraint and subclass). E: an exercise counts when the EERD has exactly the stated entities, entity types, attributes, key / partial key flags, relationship or composite entity, and the correct circle constraint. Accepted spelling variants include “matric_number” and “email_address”. The sample answer unlocks after 3 unsuccessful checks and is recorded as “Sample answers viewed”. F: 1 mark per question (matching needs every pair correct). Levels: ≥90% EER Expert, 70–89% EER Explorer, <70% Keep Practising.</p></div>
<div class=card><h3>Answer scheme used by the drawing tool</h3><div style="overflow-x:auto"><table><tr><th>Ex<th>Construct<th>Expected ERD</tr>
<tr><td>1<td>Weak entity<td><b>COLLEGE</b> (strong): <u>college_code</u>, college_name, location — <b>HAS</b>, 1:M — <b>ROOM</b> (weak, double rectangle): <u style="text-decoration-style:dashed">room_no</u> (partial key), room_type, capacity</tr>
<tr><td>2<td>Composite entity<td><b>STUDENT</b>: <u>matric_no</u>, student_name; <b>COURSE</b>: <u>course_code</u>, course_name, credit_hours; composite entity <b>REGISTRATION</b> joined directly to both, with <u>matric_no</u>, <u>course_code</u>, semester, grade (no separate diamond)</tr>
<tr><td>3<td>Superclass and subclasses, overlap<td>Superclass <b>STAFF</b>: <u>staff_id</u>, staff_name, email, department; circle <b>o</b>; subclasses <b>LECTURER</b>: teaching_load and <b>RESEARCHER</b>: research_area, grant_amount</tr></table></div></div>
<div class=card><h3>Student list (Google Sheet)</h3><p>Students register with name, matric number and section (on the same device they can reuse their Level 3 details with one tap). When every module (including all three EERDs) is complete, one row is sent to the <b>“Students L3”</b> tab of the same Google Sheet; Levels 1 and 2 keep their own tabs. Use the updated Code.gs, deploy it as a new version (Deploy > Manage deployments > New version, so the /exec URL stays the same), then paste the /exec URL into SHEET_URL at the top of the script. The Leaderboard reads the Level 3 tab.</p></div>
<div class=card><h3>Privacy & offline use</h3><p>Progress and drawings are kept in the student’s browser local storage under Level 3 keys, so Level 1 and Level 3 progress is not affected. Name, matric number and section are sent only after all modules are complete; no other personal data is requested. The only extra item stored is the avatar the student picked, which appears on the Leaderboard.</p></div>`};
